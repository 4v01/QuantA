name: CI
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas scipy scikit-learn pytest
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[v4]"
      - run: python -m pytest -q
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
      - name: Audit published results when present
        run: |
          if test -f reports/v1/provenance.json; then
            python -m alphacontextlab.audit
          fi
          if test -f reports/v2/provenance.json; then
            python -m alphacontextlab.v2.audit
          fi
          if test -f reports/v3/provenance.json; then
            python -m alphacontextlab.v3.audit
          fi
          if test -f reports/v4/provenance.json; then
            python -m alphacontextlab.v4.audit
          fi
          if test -f reports/fusion/acquisition.json; then
            python -m alphacontextlab.fusion.audit
          fi
          if test -f reports/v6/pilot/provenance.json; then
            python -m alphacontextlab.v6.audit
          fi
